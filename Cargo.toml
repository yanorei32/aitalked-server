[package]
name = "aitalked-server"
version = "0.3.6"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", features = ["json"] }
clap = { version = "4.5.48", features = ["derive", "env"] }
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["macros", "net", "rt", "time"] }
aitalked = { git = "https://github.com/yanorei32/aitalked", rev = "fb849863d92802530d614ffcd96c7d794cebfd84" }
encoding_rs = "0.8.35"
anyhow = "1.0.100"
directories = "6.0.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
zip = "8.0.0"
once_cell = "1.21.3"
base64 = "0.22.1"
serde-xml-rs = "0.8.1"
aes = "0.9.0"
cbc = "0.2.0"
flate2 = { version = "1.1.2", features = ["any_zlib", "zlib"] }
pbkdf2 = "0.13.0"
sha1 = "0.11.0"
cipher = { version = "0.5.1", features = ["block-padding"] }
